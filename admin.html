<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>SASP — Centre de Commandement</title>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="img/badge-sasp.png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="admin-body">

    <!-- ÉCRAN DE CHARGEMENT -->
    <div id="loadingScreen" class="loading-screen">
        <div class="spinner"></div>
        <h2>Vérification des accès...</h2>
    </div>

    <!-- DASHBOARD -->
    <div class="admin-dashboard" id="adminDashboard" style="display: none;">
        <aside class="admin-sidebar">
            <div class="admin-brand">
                <img src="img/badge-sasp.png" alt="SASP">
                <div>
                    <h1>Command Center</h1>
                    <span>SASP Intranet</span>
                </div>
            </div>
            <nav class="admin-nav">
                <a href="#" class="active">Gestion des pages</a>
                <a href="index.html" target="_blank">Voir le site public</a>
            </nav>
            <button id="logoutBtn" class="btn btn-outline" style="margin-top: auto;">Déconnexion</button>
        </aside>

        <main class="admin-main">
            <div class="admin-topbar">
                <h2>Gestion du contenu</h2>
                <div class="admin-user">
                    <span class="status-dot"></span> Administrateur connecté
                </div>
            </div>

            <div class="admin-panel">
                <div class="panel-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                    <div>
                        <h3>Pages existantes</h3>
                        <p>Gérez le contenu de votre site.</p>
                    </div>
                    <button class="btn btn-primary" id="btnCreateNew" style="padding: 10px 20px;">+ Nouvelle Page</button>
                </div>

                <!-- Barre de recherche -->
                <div class="admin-search-bar">
                    <input type="text" id="searchInput" placeholder="Rechercher une page par titre...">
                </div>
                
                <div class="table-responsive">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Titre de la page</th>
                                <th>URL (Slug)</th>
                                <th style="text-align: right;">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="pagesTableBody">
                            <tr><td colspan="3" style="text-align: center;">Chargement...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- MODALE D'ÉDITION -->
    <div class="modal-overlay" id="editorModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Modifier la page</h3>
                <button class="modal-close" id="btnCloseModal">&times;</button>
            </div>
            
            <div class="modal-body">
                <form id="pageForm">
                    <input type="hidden" id="pageId">
                    
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                        <div class="form-group">
                            <label>Titre de la page</label>
                            <input type="text" id="pageTitle" required placeholder="Ex: Manuel du Rookie">
                        </div>
                        <div class="form-group">
                            <label>Slug (URL)</label>
                            <input type="text" id="pageSlug" required placeholder="Ex: rookie">
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>Contenu de la page</label>
                        <div class="editor-container">
                            <div class="editor-toolbar">
                                <button type="button" onclick="formatDoc('bold')" title="Gras"><b>G</b></button>
                                <button type="button" onclick="formatDoc('italic')" title="Italique"><i>I</i></button>
                                <button type="button" onclick="formatDoc('underline')" title="Souligné"><u>S</u></button>
                                <button type="button" onclick="formatDoc('formatBlock', '<h3>')">Titre</button>
                                <button type="button" onclick="formatDoc('formatBlock', '<p>')">Paragraphe</button>
                                <button type="button" onclick="formatDoc('insertUnorderedList')">Liste</button>
                            </div>
                            <div id="editorContent" class="editor-content" contenteditable="true" data-placeholder="Écrivez votre contenu ici..."></div>
                        </div>
                    </div>
                </form>
            </div>
            
            <div class="modal-footer">
                <button class="btn btn-outline" id="btnCancelModal">Annuler</button>
                <button class="btn btn-primary" id="submitBtn" form="pageForm" type="submit">Enregistrer</button>
            </div>
        </div>
    </div>

    <!-- Notification -->
    <div class="toast-notification" id="toast">
        <span id="toastMessage">Page enregistrée !</span>
    </div>

    <script type="module" src="js/admin.js"></script>
</body>
</html>
