<!-- ========================================== -->
<!-- MODALE 2 : GESTION DES AGENTS              -->
<!-- ========================================== -->
<div class="modal-overlay" id="agentModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="agentModalTitle">Ajouter un Agent</h3>
            <button class="modal-close" id="btnCloseAgentModal">&times;</button>
        </div>
        
        <div class="modal-body">
            <form id="agentForm">
                <input type="hidden" id="agentId">
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div class="form-group">
                        <label>Nom Prénom</label>
                        <input type="text" id="agentNom" required placeholder="Ex: John Doe">
                    </div>
                    <div class="form-group">
                        <label>Matricule</label>
                        <input type="text" id="agentMatricule" placeholder="Ex: 1024">
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div class="form-group">
                        <label>Grade</label>
                        <select id="agentGrade">
                            <option value="">Sélectionner un grade...</option>
                            <option value="Cadet">Cadet</option>
                            <option value="Officer">Officer</option>
                            <option value="Officer II">Officer II</option>
                            <option value="Officer III">Officer III</option>
                            <option value="Sergeant">Sergeant</option>
                            <option value="Lieutenant">Lieutenant</option>
                            <option value="Captain">Captain</option>
                            <option value="Commander">Commander</option>
                            <option value="Chief">Chief</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Division Principale</label>
                        <select id="agentDivision">
                            <option value="">Sélectionner une division...</option>
                            <option value="METRO">METRO</option>
                            <option value="HIGHWAY">HIGHWAY</option>
                            <option value="K9">K9</option>
                            <option value="MCD">MCD</option>
                            <option value="FTO">FTO</option>
                            <option value="PA">PA</option>
                        </select>
                    </div>
                </div>

                <!-- SUPERVISEUR -->
                <div class="form-group" style="display: flex; align-items: center; gap: 10px; background: rgba(212, 175, 55, 0.1); padding: 15px; border-radius: 6px; border: 1px solid var(--gold);">
                    <input type="checkbox" id="agentSup" style="width: 20px; height: 20px; cursor: pointer;">
                    <label for="agentSup" style="margin: 0; cursor: pointer; color: var(--gold); font-weight: bold;">Supervisor de Terrain (SUP)</label>
                </div>

                <!-- FORMATIONS -->
                <div class="form-group">
                    <label>Formations Validées</label>
                    <div class="tags-input-group">
                        <select id="selectFormation" style="flex: 1; padding: 8px; background: var(--bg-dark); border: 1px solid var(--border); color: var(--text-main); border-radius: 4px;">
                            <option value="">Ajouter une formation...</option>
                            <option value="PA">Formation PA (PA)</option>
                            <option value="PPA">Formation PPA (PPA)</option>
                            <option value="PPAL">Formation PPA LOURD (PPAL)</option>
                            <option value="CDU">Formation conduite urgente (CDU)</option>
                            <option value="F-T">Formation Tazer (F-T)</option>
                            <option value="PROC">Formation Procédure (PROC)</option>
                        </select>
                        <button type="button" onclick="addTag('formation')">+</button>
                    </div>
                    <div class="active-tags" id="listFormations"></div>
                </div>

                <!-- SANCTIONS -->
                <div class="form-group">
                    <label>Sanctions</label>
                    <div class="tags-input-group">
                        <select id="selectSanction" style="flex: 1; padding: 8px; background: var(--bg-dark); border: 1px solid var(--border); color: var(--text-main); border-radius: 4px;">
                            <option value="">Ajouter une sanction...</option>
                            <option value="B1">Blâme 1 (B1)</option>
                            <option value="B2">Blâme 2 (B2)</option>
                            <option value="S">Suspendu (S)</option>
                            <option value="RENV">En cour de renvoi (RENV)</option>
                        </select>
                        <button type="button" onclick="addTag('sanction')">+</button>
                    </div>
                    <div class="active-tags" id="listSanctions"></div>
                </div>
            </form>
        </div>
        
        <div class="modal-footer">
            <button class="btn btn-outline" id="btnCancelAgentModal">Annuler</button>
            <button class="btn btn-primary" id="submitAgentBtn" form="agentForm" type="submit">Enregistrer</button>
        </div>
    </div>
</div>
