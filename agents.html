    <script type="module">
        import { supabase } from './js/supabase.js';

        let allAgents = [];

        async function fetchAgents() {
            const container = document.getElementById('agentsList');
            
            const { data: agents, error } = await supabase
                .from('agents')
                .select('*')
                .order('nom', { ascending: true });

            if (error || !agents || agents.length === 0) {
                container.innerHTML = `<p style="color: var(--text-muted); text-align: center; grid-column: 1 / -1; padding: 40px;">Aucun agent enregistré dans le registre pour le moment.</p>`;
                return;
            }

            allAgents = agents;
            renderAgents(allAgents);
        }

        function renderAgents(agentsToRender) {
            const container = document.getElementById('agentsList');
            container.innerHTML = '';

            if (agentsToRender.length === 0) {
                container.innerHTML = `<p style="color: var(--text-muted); text-align: center; grid-column: 1 / -1; padding: 40px;">Aucun agent ne correspond à votre recherche.</p>`;
                return;
            }

            agentsToRender.forEach(agent => {
                // Badge SUP
                const supBadge = agent.est_superviseur 
                    ? ' <span class="agent-badge" style="background:var(--gold); color:var(--bg-dark); font-weight:bold; margin-left:5px;">SUP</span>' 
                    : '';

                // Formations (Étiquettes)
                const formationsHtml = agent.formations && agent.formations.length > 0 
                    ? agent.formations.map(f => `<span class="tag">${f}</span>`).join('') 
                    : '<span style="font-size:0.8rem; color:var(--text-muted);">Aucune formation</span>';

                // Sanctions (Badges rouges)
                const sanctionsHtml = agent.sanctions && agent.sanctions.length > 0
                    ? agent.sanctions.map(s => `<span class="agent-badge sanction">${s}</span>`).join('')
                    : '';

                // Gestion des divisions multiples
                let divisionsHtml = '<span class="agent-badge">Aucune division</span>';
                if (agent.division) {
                    if (Array.isArray(agent.division)) {
                        divisionsHtml = agent.division.map(d => `<span class="agent-badge">${d}</span>`).join(' ');
                    } else {
                        divisionsHtml = `<span class="agent-badge">${agent.division}</span>`;
                    }
                }

                const card = document.createElement('div');
                card.className = 'agent-card';
                
                card.innerHTML = `
                    <div class="agent-header">
                        <div>
                            <div class="agent-name">${agent.nom} ${supBadge}</div>
                            <div class="agent-matricule">#${agent.matricule || 'N/A'}</div>
                        </div>
                    </div>
                    
                    <div class="agent-info-row" style="margin-bottom: 15px;">
                        <span class="agent-badge grade">${agent.grade || 'Sans grade'}</span>
                        ${divisionsHtml}
                    </div>

                    <!-- SANCTIONS BIEN VISIBLES -->
                    ${sanctionsHtml ? `
                    <div style="background: rgba(239, 68, 68, 0.1); border-left: 4px solid #ef4444; padding: 10px 15px; margin-bottom: 15px; border-radius: 4px;">
                        <div style="font-size: 0.75rem; color: #ef4444; text-transform: uppercase; font-weight: bold; margin-bottom: 5px;">⚠️ Sanctions en cours</div>
                        <div class="agent-info-row">${sanctionsHtml}</div>
                    </div>` : ''}

                    <div style="margin-top: 15px;">
                        <div style="font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px;">Formations Validées</div>
                        <div class="tags-container">${formationsHtml}</div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Barre de recherche
        document.getElementById('searchAgent').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = allAgents.filter(a => {
                const matchNom = a.nom.toLowerCase().includes(term);
                const matchMatricule = a.matricule && a.matricule.includes(term);
                const matchDiv = a.division && (
                    Array.isArray(a.division) 
                        ? a.division.some(d => d.toLowerCase().includes(term)) 
                        : a.division.toLowerCase().includes(term)
                );
                return matchNom || matchMatricule || matchDiv;
            });
            renderAgents(filtered);
        });

        // Lancer le chargement
        fetchAgents();
    </script>
